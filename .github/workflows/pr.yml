on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: number

# cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  CI: true

name: CI

defaults:
  run:
    shell: bash
    working-directory: lambda

jobs:
  resolve-pr-head:
    name: Resolve pull request head
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve pull request head SHA
        id: resolve
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |-
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed('pr_number must be a positive integer');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            core.setOutput('sha', pull.head.sha);

  build-and-test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve-pr-head
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-pr-head.outputs.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: 'lambda/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'lambda/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  mark-manual-status-pending:
    name: Mark required statuses pending
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: resolve-pr-head
    permissions:
      statuses: write
    steps:
      - name: Mark required statuses as pending
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
        env:
          REQUIRED_CONTEXTS: '["tests"]'
          HEAD_SHA: ${{ needs.resolve-pr-head.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |-
            const contexts = JSON.parse(process.env.REQUIRED_CONTEXTS);
            for (const requiredContext of contexts) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.HEAD_SHA,
                state: 'pending',
                context: requiredContext,
                description: 'Manual validation is running',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
  report-manual-required-status:
    name: Report required statuses
    if: always() && github.event_name == 'workflow_dispatch'
    needs:
      - resolve-pr-head
      - mark-manual-status-pending
      - build-and-test
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish required statuses for this commit
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
        env:
          REQUIRED_CONTEXT_JOBS: '{"tests":["build-and-test"]}'
          NEEDS_RESULTS: '${{ toJSON(needs) }}'
          HEAD_SHA: ${{ needs.resolve-pr-head.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |-
            const contextJobs = JSON.parse(process.env.REQUIRED_CONTEXT_JOBS);
            const results = JSON.parse(process.env.NEEDS_RESULTS);
            const headSha = process.env.HEAD_SHA;
            if (!headSha) {
              core.warning('Pull request head SHA was not resolved; no status was published.');
              return;
            }
            for (const [requiredContext, jobIds] of Object.entries(contextJobs)) {
              const success = jobIds.every(jobId => results[jobId]?.result === 'success');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: success ? 'success' : 'failure',
                context: requiredContext,
                description: success ? 'Manual validation passed' : 'Manual validation failed',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
