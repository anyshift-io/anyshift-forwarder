on:
  workflow_dispatch:

# cancel previous runs on the same PR
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

name: CI

defaults:
  run:
    shell: bash
    working-directory: lambda

jobs:
  build-and-test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: 'lambda/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'lambda/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  mark-manual-status-pending:
    name: Mark required statuses pending
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark required statuses as pending
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
        env:
          REQUIRED_CONTEXTS: '["tests"]'
        with:
          github-token: ${{ github.token }}
          script: |-
            const contexts = JSON.parse(process.env.REQUIRED_CONTEXTS);
            for (const requiredContext of contexts) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'pending',
                context: requiredContext,
                description: 'Manual validation is running',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
  report-manual-required-status:
    name: Report required statuses
    if: always() && github.event_name == 'workflow_dispatch'
    needs:
      - mark-manual-status-pending
      - build-and-test
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish required statuses for this commit
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
        env:
          REQUIRED_CONTEXT_JOBS: '{"tests":["build-and-test"]}'
          NEEDS_RESULTS: '${{ toJSON(needs) }}'
        with:
          github-token: ${{ github.token }}
          script: |-
            const contextJobs = JSON.parse(process.env.REQUIRED_CONTEXT_JOBS);
            const results = JSON.parse(process.env.NEEDS_RESULTS);
            for (const [requiredContext, jobIds] of Object.entries(contextJobs)) {
              const success = jobIds.every(jobId => results[jobId]?.result === 'success');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: success ? 'success' : 'failure',
                context: requiredContext,
                description: success ? 'Manual validation passed' : 'Manual validation failed',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
